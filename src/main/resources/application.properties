# Server configuration
server.port=8080
server.servlet.context-path=/

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aspiring_investments
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=11oETzKXQAGaYdkL5gEmGeJJFuYh7EQnp2XdTP1o/Vo=
jwt.expiration=86400000

# Mail configuration (configure for your SMTP server)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=aspiring.investments@gmail.com

# AWS configuration (set these via environment variables)
# aws.access-key-id=${AWS_ACCESS_KEY_ID}
# aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
# aws.region=${AWS_REGION:us-east-1}
# aws.s3.bucket=${S3_BUCKET:aspiring-investments}

# Logging configuration
logging.level.com.aspiringinvestments=DEBUG
logging.level.org.springframework.security=DEBUG

# Application configuration
spring.application.name=aspiring-investments-backend