# Server configuration
server.port=8080
server.servlet.context-path=/

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aspiring_investments}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
# Required: at least 32 bytes. The app refuses to start without it unless the 'dev' profile is active.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mail configuration (configure for your SMTP server)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=aspiring.investments@gmail.com

# AWS configuration (set these via environment variables)
# aws.access-key-id=${AWS_ACCESS_KEY_ID}
# aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
# aws.region=${AWS_REGION:us-east-1}
# aws.s3.bucket=${S3_BUCKET:aspiring-investments}

# Logging configuration
logging.level.com.aspiringinvestments=DEBUG
logging.level.org.springframework.security=DEBUG

# Application configuration
spring.application.name=aspiring-investments-backend